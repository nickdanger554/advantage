name: Validate Claude package
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-contract-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes --package @anthropic-ai/claude-code@2.1.289 claude plugin validate --strict .
      - run: npx --yes --package @anthropic-ai/claude-code@2.1.289 claude plugin validate --strict storeadops
